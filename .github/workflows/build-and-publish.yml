name: Build and publish Docker image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA, tag, or branch to build'
        required: true
        type: string
      container-tag:
        description: 'Tag for the Docker image (e.g. nightly, v10.5.0)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-x64-large
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Docker Buildx
        run: docker buildx create --use

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/grafana:${{ inputs.container-tag }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --push \
            --tag "$IMAGE" \
            .
